<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Adaptive-icon FOREGROUND layer: the open-hardcover mark on transparent,
       scaled into the inner ~62% of the 108dp canvas (the adaptive-icon safe
       zone) so launcher masks and animations never crop it. -->
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e3a27"/>
      <stop offset="1" stop-color="#31251a"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0d2ae"/>
      <stop offset="1" stop-color="#c2b088"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6cc"/>
      <stop offset="1" stop-color="#d6c6a1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b3d31"/>
      <stop offset="1" stop-color="#5c2c23"/>
    </linearGradient>
  </defs>

  <g transform="translate(256 256) scale(0.62) translate(-256 -266)">
    <path d="M 26 176 Q 26 165 35 165 L 477 165 Q 486 165 486 176
             C 486 316 481 384 462 412 C 382 448 296 460 256 460
             C 216 460 130 448 50 412 C 31 384 26 316 26 176 Z"
          fill="url(#leather)"/>
    <ellipse cx="256" cy="456" rx="26" ry="8" fill="#241a11"/>

    <path d="M 45 168 C 45 308 50 366 63 392 C 138 426 218 436 256 436
             C 294 436 374 426 449 392 C 462 366 467 308 467 168 Z"
          fill="url(#stack)"/>
    <g fill="none" stroke="#a3916e" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M 60 354 C 132 384 216 394 256 394 C 296 394 380 384 452 354"/>
      <path d="M 58 374 C 130 404 216 414 256 414 C 296 414 382 404 454 374"/>
      <path d="M 64 334 C 134 364 216 374 256 374 C 296 374 378 364 448 334"/>
      <path d="M 70 392 C 140 420 218 428 256 428"/>
    </g>

    <path d="M 254 138 C 210 106 124 100 48 122 L 44 320
             C 116 296 210 302 254 336 Z" fill="url(#page)"/>
    <path d="M 258 138 C 302 106 388 100 464 122 L 468 320
             C 396 296 302 302 258 336 Z" fill="url(#page)"/>
    <path d="M 256 136 C 250 204 250 282 256 340" fill="none"
          stroke="#7a684a" stroke-width="3.5" opacity="0.75"/>

    <path d="M 246 326 L 266 326 L 266 478 L 256 462 L 246 478 Z"
          fill="url(#ribbon)"/>
  </g>
