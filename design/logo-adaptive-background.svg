<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Adaptive-icon BACKGROUND layer: the full-bleed dark-leather tile. No
       rounded corners — the launcher applies its own mask. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2118"/>
      <stop offset="1" stop-color="#1d1710"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
</svg>
