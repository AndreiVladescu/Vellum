<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Vellum app-icon tile: a cream open book with a gold bookmark ribbon on a
       warm ink tile. Full-bleed background so launcher masks (circle/squircle)
       crop cleanly. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4e32"/>
      <stop offset="1" stop-color="#4f3924"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efdd"/>
      <stop offset="1" stop-color="#e7d9bd"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a860"/>
      <stop offset="1" stop-color="#b9863f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#tile)"/>

  <path d="M238 196 H274 V402 L256 380 L238 402 Z" fill="url(#ribbon)"/>

  <path d="M256 178 C 210 152, 150 152, 104 174 L 104 346 C 150 324, 210 324, 256 350 Z"
        fill="url(#page)" stroke="#3d2c1a" stroke-width="11" stroke-linejoin="round"/>
  <path d="M256 178 C 302 152, 362 152, 408 174 L 408 346 C 362 324, 302 324, 256 350 Z"
        fill="url(#page)" stroke="#3d2c1a" stroke-width="11" stroke-linejoin="round"/>
  <path d="M256 178 L256 350" fill="none" stroke="#3d2c1a" stroke-width="11" stroke-linecap="round"/>

  <g stroke="#b07f4e" stroke-width="8" stroke-linecap="round">
    <path d="M142 218 H222"/><path d="M142 256 H222"/><path d="M142 294 H206"/>
    <path d="M290 218 H370"/><path d="M290 256 H370"/><path d="M306 294 H370"/>
  </g>
</svg>
