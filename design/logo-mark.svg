<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Vellum logo mark: an open book of two page-leaves parted by a fine crease,
       with a gold bookmark ribbon notched into a "V". Cream fill + a fine sepia
       outline so it reads on light or medium surfaces (console header, in-app).
       Refined/monoline: thin even stroke, no scribbled text lines. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#efe4cf"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87b4c"/>
      <stop offset="1" stop-color="#875f38"/>
    </linearGradient>
  </defs>

  <path d="M244 198 H268 V408 L256 386 L244 408 Z" fill="url(#ribbon)"/>

  <g fill="url(#page)" stroke="#5f4327" stroke-width="8" stroke-linejoin="round">
    <path d="M250 198 C 206 174, 150 172, 104 184 L 104 336 C 150 324, 206 322, 250 336 Z"/>
    <path d="M262 198 C 306 174, 362 172, 408 184 L 408 336 C 362 324, 306 322, 262 336 Z"/>
  </g>
</svg>
