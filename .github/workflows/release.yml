# Release artefacts (plan 5 #36).
#
# The single-static-binary advantage is only real if people can download one, so
# a tag builds the server for the platforms self-hosters actually use, plus the
# Android app, and attaches everything to a GitHub Release with checksums.
#
# Triggered by a `v*` tag; `workflow_dispatch` is kept so a release can be
# rehearsed without tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl for Linux: a static binary that runs on any distribution,
          # which is the whole promise of "single binary".
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross-compiler
        if: matrix.cross
        run: |
          cargo install cross --locked
      - name: Build
        working-directory: server
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package
        working-directory: server
        shell: bash
        run: |
          name="vellum-server-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/vellum-server.exe" ]; then
            cp "target/${{ matrix.target }}/release/vellum-server.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/vellum-server" "dist/$name/"
          fi
          cp ../docs/DEPLOYMENT.md "dist/$name/" || true
          cp ../packaging/vellum-server.service "dist/$name/" || true
          (cd dist && tar czf "$name.tar.gz" "$name")
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: server/dist/*.tar.gz*

  # The server as a container image, so running it is `docker pull` rather than
  # clone-and-build. Pushed to GHCR (always available, authenticated by the
  # workflow's own token) and to Docker Hub (where most people look first, but
  # which needs an account and secrets the repository may not have yet).
  #
  # A rehearsal builds both platforms and pushes nothing, so the arm64 half of
  # the Dockerfile stays exercised without tagging.
  #
  # Its own permissions: `packages: write` is the only thing that lets this job
  # publish, and nothing else in the file should be able to.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Secrets cannot be tested in an `if:`, but the env they are mapped to can.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Registry names must be lowercase and the owner may not be. Derived rather
      # than hardcoded so a fork publishes to its own namespace.
      - name: Work out where to push
        id: where
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ghcr=ghcr.io/${owner}/vellum-server" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rehearsal (no tag): building linux/amd64 and linux/arm64, pushing nothing."
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            # A release must not fail because Docker Hub is not set up yet, but
            # it must also not silently skip it: nobody reads a log of a job that
            # succeeded, so the summary says it too.
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set, so Docker Hub is skipped. Publishing to GHCR only."
            echo 'Docker Hub was **skipped**: `DOCKERHUB_USERNAME` / `DOCKERHUB_TOKEN` are not set. GHCR only.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # arm64 is built by cross-compiling (see the Dockerfile), so QEMU is only
      # needed for the few `apt-get` commands in the arm64 runtime stage.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: steps.where.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.where.outputs.push == 'true' && steps.where.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # `latest=auto` gives `latest` to a plain vX.Y.Z tag and not to a
      # prerelease (v1.2.3-rc1), which is what keeps `:latest` meaning "the
      # newest real release". `X.Y` is likewise skipped for prereleases. The
      # `rehearsal` tag only exists so a no-push build has a name.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.where.outputs.ghcr }}
            ${{ steps.where.outputs.dockerhub == 'true' && format('{0}/vellum-server', env.DOCKERHUB_USERNAME) || '' }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=rehearsal,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=Vellum server
            org.opencontainers.image.description=Self-hosted sync server for the Vellum personal library manager
            org.opencontainers.image.licenses=AGPL-3.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.where.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations ride in the same image index as extra manifests. Both
          # registries store them; Docker Hub's tag page lists them as an
          # "unknown/unknown" platform, which is expected rather than a fault.
          provenance: true
          sbom: true
          # Own scope: ci.yml's docker job caches a single-platform build under
          # the default one, and the two would overwrite each other.
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max
      - name: Summary
        if: steps.where.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The Docker Hub page is a separate piece of state from the image, kept in
      # the repository so it is reviewed like anything else. `continue-on-error`
      # because the API wants a token with more than push rights: an
      # under-scoped one should cost the page text, not the release.
      #
      # The checked-in page names the account with a placeholder, because the
      # account is a secret-adjacent value that does not belong in the repo.
      - name: Fill in the Docker Hub account name
        if: steps.where.outputs.push == 'true' && steps.where.outputs.dockerhub == 'true'
        run: sed -i "s|VELLUM_DOCKERHUB_NAMESPACE|${DOCKERHUB_USERNAME,,}|g" docs/DOCKERHUB.md
      - name: Docker Hub description
        if: steps.where.outputs.push == 'true' && steps.where.outputs.dockerhub == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/vellum-server
          short-description: Self-hosted sync server for the Vellum personal library manager
          readme-filepath: docs/DOCKERHUB.md

  # The desktop app (plan 6 #2). Without these, every desktop user has to
  # install Flutter and a C++ toolchain before they can open a book — the
  # difference between a product and a source tree.
  desktop:
    name: app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: an unpinned `stable` moved to 3.50 overnight (2026-11-12),
          # which deprecates `package:flutter/material.dart`, and `flutter analyze`
          # went red on 150 infos nobody had written. Move this on purpose.
          flutter-version: 3.47.9
      # Flutter builds a real native app, so each platform needs its own
      # toolchain. Windows and macOS runners already carry theirs.
      # Windows and macOS runners already carry their toolchains; Linux needs
      # GTK, CMake and libsecret installing. Shared with ci.yml so the two
      # cannot disagree — they did, and the release run was where it showed.
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-flutter-deps
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release
      # Packaged per platform, keeping each one's layout intact. The Linux
      # bundle in particular must stay whole: the executable needs `lib/` and
      # `data/` beside it, so shipping the binary alone would ship something
      # that cannot start.
      # Three Linux artefacts, because "keep the folder together" is not an
      # install story:
      #   .AppImage — one file, no install, no root, any distribution
      #   .deb      — apt-managed, menu entry, declared dependencies
      #   .tar.gz   — the bundle plus install.sh, for everything else
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        working-directory: app
        run: |
          mkdir -p dist
          linux/packaging/build-appimage.sh
          linux/packaging/build-deb.sh
          # Staged under a versioned directory: extracting straight into `.`
          # sprays `vellum`, `lib/` and `data/` loose over whatever directory
          # the user happened to be in.
          VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          STAGE="vellum-$VERSION"
          mkdir -p "$STAGE/share"
          cp -r build/linux/x64/release/bundle/. "$STAGE/"
          cp linux/packaging/install.sh "$STAGE/"
          cp -r linux/packaging/icons "$STAGE/share/"
          cp ../README.md "$STAGE/README.txt"
          tar -czf "dist/vellum-linux-x64.tar.gz" "$STAGE"
          rm -f dist/.appimagetool
          # Named per platform. Every job used to write plain `SHA256SUMS`, and
          # a release's asset names have to be unique — so the four collided and
          # exactly one survived (v1.1.0 shipped with only the macOS one, which
          # left the AppImage, .deb, tarball, Windows zip and every APK with no
          # checksum at all while the notes said to check them).
          (cd dist && sha256sum * > SHA256SUMS-linux)
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/vellum-windows-x64.zip
          (Get-FileHash dist/vellum-windows-x64.zip -Algorithm SHA256).Hash `
            | Out-File dist/SHA256SUMS-windows
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        working-directory: app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/vellum.app \
            dist/vellum-macos.zip
          (cd dist && shasum -a 256 * > SHA256SUMS-macos)
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}
          path: app/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 21, not 17: app/android/gradle/gradle-daemon-jvm.properties asks for a
      # JDK 21 to run Gradle, and this one (JAVA_HOME) is where it finds it.
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: an unpinned `stable` moved to 3.50 overnight (2026-11-12),
          # which deprecates `package:flutter/material.dart`, and `flutter analyze`
          # went red on 150 infos nobody had written. Move this on purpose.
          flutter-version: 3.47.9
      # Reconstitutes android/key.properties from repository secrets, when they
      # are set. Four are needed: ANDROID_KEYSTORE_BASE64 (the .jks, base64'd),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS.
      #
      # Without them the build still succeeds and falls back to the debug key —
      # which is fine for a test run and *not* fine to publish, so the step
      # after this one says which of the two happened rather than leaving it to
      # be discovered after release.
      - name: Signing key
        id: signing
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # v1.1.0 went out debug-signed because this only warned, and a
            # warning in a job log is not read before people start downloading.
            # But *failing* is the wrong correction: it blocked the Linux,
            # Windows, macOS and server artefacts too, because `publish` needs
            # this job. The thing that must not happen is publishing an
            # unusable APK, not building one — so a tag without a keystore
            # simply ships no Android artefacts and says so loudly.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this"\
                   "release will have NO Android artefacts. A debug-signed"\
                   "APK can never be upgraded in place, so none is better"\
                   "than one. Set the secrets (DEVELOPER.md) and re-tag to"\
                   "include Android."
            fi
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > upload.jks
          cat > key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload.jks
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Skipped on a tag with no keystore: there is nothing publishable to
      # build, and a rehearsal (workflow_dispatch) still builds so the Android
      # path stays exercised.
      - name: Build app bundle and per-ABI APKs
        if: steps.signing.outputs.signed == 'true' || github.ref_type != 'tag'
        working-directory: app
        run: |
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
      # Checks the artefact rather than the inputs. The secret being present
      # proves a keystore was written, not that Gradle used it — a typo in the
      # alias, or a `key.properties` the build could not read, both end in a
      # silent fall back to the debug key, which is precisely the failure this
      # is here to catch. A debug certificate's subject is `CN=Android Debug`,
      # and it appears verbatim in the APK signing block.
      - name: Check what actually signed the APK
        if: steps.signing.outputs.signed == 'true' || github.ref_type != 'tag'
        working-directory: app
        run: |
          apk=$(ls build/app/outputs/flutter-apk/*-release.apk | head -1)
          if grep -qa 'Android Debug' "$apk"; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::$apk is DEBUG-SIGNED despite a keystore being"\
                   "configured. Not publishing it."
              exit 1
            fi
            echo "::warning::$apk is debug-signed (no keystore on this run)."
          else
            echo "::notice::Android artefacts are signed with the release key."
          fi
      # The keystore is written into the workspace, which is discarded with the
      # runner — but an artefact upload globs the tree, so remove it explicitly
      # rather than trusting that nothing will ever pick it up.
      - name: Remove the keystore
        if: always()
        working-directory: app/android
        run: rm -f upload.jks key.properties
      - name: Checksums
        if: steps.signing.outputs.signed == 'true' || github.ref_type != 'tag'
        working-directory: app
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/*.aab dist/ || true
          cp build/app/outputs/flutter-apk/*.apk dist/ || true
          (cd dist && sha256sum * > SHA256SUMS-android)
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.signed == 'true' || github.ref_type != 'tag'
        with:
          name: android
          path: app/dist/*

  publish:
    needs: [server, desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # The tag's own notes come from CHANGELOG.md rather than being written
      # twice: a release whose notes disagree with the changelog is a release
      # nobody can check afterwards. The section is sliced out by heading, so
      # the only thing a tag has to get right is matching a `## vX.Y.Z` line.
      - uses: actions/checkout@v7
      - name: This version's notes
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="## $version" '
            $0 ~ "^"v" " || $0 == v {found=1; next}
            found && /^## v/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section — write it before tagging."
            exit 1
          fi
          # The downloads table is the same every time and belongs to the
          # release page rather than to the changelog.
          cat .github/release-downloads.md >> notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body_path: notes.md
          generate_release_notes: true
