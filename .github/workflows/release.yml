# Release artefacts (plan 5 #36).
#
# The single-static-binary advantage is only real if people can download one, so
# a tag builds the server for the platforms self-hosters actually use, plus the
# Android app, and attaches everything to a GitHub Release with checksums.
#
# Triggered by a `v*` tag; `workflow_dispatch` is kept so a release can be
# rehearsed without tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl for Linux: a static binary that runs on any distribution,
          # which is the whole promise of "single binary".
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross-compiler
        if: matrix.cross
        run: |
          cargo install cross --locked
      - name: Build
        working-directory: server
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package
        working-directory: server
        shell: bash
        run: |
          name="vellum-server-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/vellum-server.exe" ]; then
            cp "target/${{ matrix.target }}/release/vellum-server.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/vellum-server" "dist/$name/"
          fi
          cp ../docs/DEPLOYMENT.md "dist/$name/" || true
          cp ../packaging/vellum-server.service "dist/$name/" || true
          (cd dist && tar czf "$name.tar.gz" "$name")
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: server/dist/*.tar.gz*

  # The desktop app (plan 6 #2). Without these, every desktop user has to
  # install Flutter and a C++ toolchain before they can open a book — the
  # difference between a product and a source tree.
  desktop:
    name: app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Flutter builds a real native app, so each platform needs its own
      # toolchain. Windows and macOS runners already carry theirs.
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release
      # Packaged per platform, keeping each one's layout intact. The Linux
      # bundle in particular must stay whole: the executable needs `lib/` and
      # `data/` beside it, so shipping the binary alone would ship something
      # that cannot start.
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        working-directory: app
        run: |
          mkdir -p dist
          tar -czf dist/vellum-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/vellum-windows-x64.zip
          (Get-FileHash dist/vellum-windows-x64.zip -Algorithm SHA256).Hash `
            | Out-File dist/SHA256SUMS
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        working-directory: app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/vellum.app \
            dist/vellum-macos.zip
          (cd dist && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: app/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build app bundle and per-ABI APKs
        working-directory: app
        # Unsigned unless key.properties is present (see android/README): a
        # release build without signing config still produces installable
        # artefacts, it just isn't Play-uploadable.
        run: |
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
      - name: Checksums
        working-directory: app
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/*.aab dist/ || true
          cp build/app/outputs/flutter-apk/*.apk dist/ || true
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/dist/*

  publish:
    needs: [server, desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Said here rather than left for people to discover at launch: the
          # desktop builds are unsigned, because signing needs certificates
          # that cost money and belong to a person, not a repository.
          body: |
            ## Downloads

            | | |
            |---|---|
            | **Desktop app** | `vellum-linux-x64.tar.gz`, `vellum-windows-x64.zip`, `vellum-macos.zip` |
            | **Android** | `app-release.aab` (Play), or the per-ABI `.apk` to sideload |
            | **Server** | `vellum-server-<target>` for four targets, or `docker build .` |

            On Linux, keep the extracted folder together — the executable needs
            `lib/` and `data/` beside it.

            **The desktop builds are unsigned.** macOS will refuse the first
            launch: right-click the app and choose Open, or
            `xattr -d com.apple.quarantine vellum.app`. Windows SmartScreen will
            warn; choose *More info → Run anyway*. Check the `SHA256SUMS` beside
            each artefact if you want to verify what you downloaded.
