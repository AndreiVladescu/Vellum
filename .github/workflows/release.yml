# Release artefacts (plan 5 #36).
#
# The single-static-binary advantage is only real if people can download one, so
# a tag builds the server for the platforms self-hosters actually use, plus the
# Android app, and attaches everything to a GitHub Release with checksums.
#
# Triggered by a `v*` tag; `workflow_dispatch` is kept so a release can be
# rehearsed without tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl for Linux: a static binary that runs on any distribution,
          # which is the whole promise of "single binary".
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross-compiler
        if: matrix.cross
        run: |
          cargo install cross --locked
      - name: Build
        working-directory: server
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package
        working-directory: server
        shell: bash
        run: |
          name="vellum-server-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/vellum-server.exe" ]; then
            cp "target/${{ matrix.target }}/release/vellum-server.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/vellum-server" "dist/$name/"
          fi
          cp ../docs/DEPLOYMENT.md "dist/$name/" || true
          cp ../packaging/vellum-server.service "dist/$name/" || true
          (cd dist && tar czf "$name.tar.gz" "$name")
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: server/dist/*.tar.gz*

  # The desktop app (plan 6 #2). Without these, every desktop user has to
  # install Flutter and a C++ toolchain before they can open a book — the
  # difference between a product and a source tree.
  desktop:
    name: app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Flutter builds a real native app, so each platform needs its own
      # toolchain. Windows and macOS runners already carry theirs.
      # Windows and macOS runners already carry their toolchains; Linux needs
      # GTK, CMake and libsecret installing. Shared with ci.yml so the two
      # cannot disagree — they did, and the release run was where it showed.
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-flutter-deps
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release
      # Packaged per platform, keeping each one's layout intact. The Linux
      # bundle in particular must stay whole: the executable needs `lib/` and
      # `data/` beside it, so shipping the binary alone would ship something
      # that cannot start.
      # Three Linux artefacts, because "keep the folder together" is not an
      # install story:
      #   .AppImage — one file, no install, no root, any distribution
      #   .deb      — apt-managed, menu entry, declared dependencies
      #   .tar.gz   — the bundle plus install.sh, for everything else
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        working-directory: app
        run: |
          mkdir -p dist
          linux/packaging/build-appimage.sh
          linux/packaging/build-deb.sh
          # Staged under a versioned directory: extracting straight into `.`
          # sprays `vellum`, `lib/` and `data/` loose over whatever directory
          # the user happened to be in.
          VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          STAGE="vellum-$VERSION"
          mkdir -p "$STAGE/share"
          cp -r build/linux/x64/release/bundle/. "$STAGE/"
          cp linux/packaging/install.sh "$STAGE/"
          cp -r linux/packaging/icons "$STAGE/share/"
          cp ../README.md "$STAGE/README.txt"
          tar -czf "dist/vellum-linux-x64.tar.gz" "$STAGE"
          rm -f dist/.appimagetool
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/vellum-windows-x64.zip
          (Get-FileHash dist/vellum-windows-x64.zip -Algorithm SHA256).Hash `
            | Out-File dist/SHA256SUMS
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        working-directory: app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/vellum.app \
            dist/vellum-macos.zip
          (cd dist && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}
          path: app/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Reconstitutes android/key.properties from repository secrets, when they
      # are set. Four are needed: ANDROID_KEYSTORE_BASE64 (the .jks, base64'd),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS.
      #
      # Without them the build still succeeds and falls back to the debug key —
      # which is fine for a test run and *not* fine to publish, so the step
      # after this one says which of the two happened rather than leaving it to
      # be discovered after release.
      - name: Signing key
        id: signing
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > upload.jks
          cat > key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload.jks
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build app bundle and per-ABI APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
      - name: How this build is signed
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "::notice::Signed with the release keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this build is"\
                 "DEBUG-SIGNED. It installs, but it cannot go to Play and can"\
                 "never be upgraded in place by a properly signed build."
          fi
      # The keystore is written into the workspace, which is discarded with the
      # runner — but an artefact upload globs the tree, so remove it explicitly
      # rather than trusting that nothing will ever pick it up.
      - name: Remove the keystore
        if: always()
        working-directory: app/android
        run: rm -f upload.jks key.properties
      - name: Checksums
        working-directory: app
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/*.aab dist/ || true
          cp build/app/outputs/flutter-apk/*.apk dist/ || true
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: app/dist/*

  publish:
    needs: [server, desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # The tag's own notes come from CHANGELOG.md rather than being written
      # twice: a release whose notes disagree with the changelog is a release
      # nobody can check afterwards. The section is sliced out by heading, so
      # the only thing a tag has to get right is matching a `## vX.Y.Z` line.
      - uses: actions/checkout@v7
      - name: This version's notes
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="## $version" '
            $0 ~ "^"v" " || $0 == v {found=1; next}
            found && /^## v/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section — write it before tagging."
            exit 1
          fi
          # The downloads table is the same every time and belongs to the
          # release page rather than to the changelog.
          cat .github/release-downloads.md >> notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body_path: notes.md
          generate_release_notes: true
