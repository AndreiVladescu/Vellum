name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Nothing secret may be tracked, whatever .gitignore says — `git add -f`
  # overrides it, and a key pushed once is a key to replace, not to delete.
  # Checks what git *has*, not what is on disk, so it is unaffected by whether
  # a contributor happens to hold these files locally.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets are tracked
        run: |
          bad=$(git ls-files | grep -E '^\.vault/|\.jks$|\.keystore$|(^|/)key\.properties$|\.p12$|\.pem$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These are tracked and must not be:"
            echo "$bad"
            exit 1
          fi
          echo "No keystores, key.properties or .vault files are tracked."

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Compile-checked queries (plan 5 #46) only stay honest if `.sqlx/` matches
      # the migrations. Rebuilding it here and failing on a diff means a query
      # edited without re-running `cargo sqlx prepare` is caught in review rather
      # than becoming a runtime 500.
      - name: Check .sqlx is current
        run: |
          cargo install sqlx-cli --version 0.9.0 --no-default-features \
            --features sqlite,rustls --locked
          export DATABASE_URL="sqlite://$PWD/ci-prepare.db?mode=rwc"
          sqlx database create
          sqlx migrate run
          cargo sqlx prepare --check -- --lib
          rm -f ci-prepare.db*

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/linux-flutter-deps
      - run: flutter pub get
      # Fail if the committed drift codegen is stale — the easiest CLAUDE.md
      # step to forget after editing database.dart.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- lib/data/database.g.dart
      # Same idea for the localization codegen (plan 5 #38): the generated
      # classes are committed so they're reviewable, which only works if they
      # match the ARB. Regenerating and failing on a diff catches a message
      # added without re-running gen-l10n.
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/
      # No new hardcoded user-facing strings in the files already migrated.
      - run: ./tool/check_l10n.sh
      # Either flavour is a valid thing to commit; a half-switched one is not.
      # `check` asserts the four things tool/flavour.sh toggles agree with each
      # other, which fails here legibly instead of as an unresolved import in a
      # build log. See docs/FDROID.md.
      - run: tool/flavour.sh check
      - run: flutter analyze
      - run: flutter test
      # Already covered by `flutter test` above; run it again verbosely so its
      # per-query timings (docs/PERFORMANCE.md) are visible in the CI log
      # instead of buried in the full suite's output.
      - run: flutter test test/benchmark/library_bench.dart -r expanded
      # Compile the native desktop runner too: analyze + test build no native
      # code, so a plugin/toolchain break (e.g. a bad flutter_secure_storage
      # build) would land green and only fail on the user's machine. Debug — a
      # compile check, not a release artifact.
      - run: flutter build linux --debug

  # Build the Android distribution artifact so a plugin/manifest/Gradle break
  # surfaces in CI rather than at release time. No key.properties secret here, so
  # the release build uses the debug-key fallback — a build check, not shippable.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build appbundle --release

  # Cross-stack smoke test: a real server + the real client over the wire,
  # catching wire-format regressions a fake-only suite would miss.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/linux-flutter-deps
      - run: bash scripts/e2e_sync.sh

  # Fail the build when a server dependency has a known RustSec advisory, so a
  # newly disclosed CVE surfaces here instead of lingering in a release. See
  # docs/SECURITY_AUDIT.md (M4). Uses a prebuilt cargo-audit for speed.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Two advisories are ignored with cause; every *other* (and every new) one
      # fails the build. Revisit these when upstream moves.
      #  - RUSTSEC-2023-0071 (rsa "Marvin" timing attack): no fixed release
      #    exists, and `rsa` is a lockfile-only artifact here — not in the
      #    compiled tree (`cargo tree -i rsa` is empty) and Vellum performs no
      #    RSA, so it is not reachable/exploitable.
      #  - RUSTSEC-2026-0192 (ttf-parser unmaintained): pulled by lopdf for PDF
      #    parsing; a maintenance warning, not a vulnerability, unfixable here.
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0192

  # `cargo audit` covers one of the four dependency sets. This covers all of
  # them from one advisory database (OSV): `app/pubspec.lock` for the Flutter
  # side, `server/Cargo.lock` for the server, and the images the Dockerfile
  # pulls. Dependabot proposes *upgrades*; this is the check that fails when
  # something shipped is known-vulnerable, and unlike Dependabot it can be run
  # locally with the same binary.
  #
  # The two long-standing Rust exceptions are carried over from `cargo audit`
  # above with the same reasoning; see osv-scanner.toml for why.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      # Plain checkout, like every other job here. This step once carried
      # GIT_SSL_CAINFO/SSL_CERT_FILE overrides added after a "server certificate
      # verification failed" failure; they did not prevent it recurring, and git
      # still reported `CAfile: none`, so they never reached it. Every other job
      # checks out with the runner's defaults in the same run, which is the
      # evidence that the overrides were the only thing different about this one.
      # If the error comes back with no overrides in place, it is the runner's
      # TLS and the remedy is a re-run, not a workflow change.
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./

  # The console's importer parses catalogues in the browser, and a parser is
  # exactly the kind of code that breaks quietly. No framework: it runs the real
  # console.js in a `vm` context with a DOM stub.
  console-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node --check server/web/console.js
      - run: node server/web/tests/import_parse.test.js
      - run: node server/web/tests/first_run.test.js
      - run: node server/web/tests/share_state.test.js
      - run: node server/web/tests/detail_edits.test.js
      - run: node server/web/tests/pages.test.js
      - run: node server/web/tests/loans_page.test.js
      - run: node server/web/tests/grant_access.test.js
      - run: node server/web/tests/invite.test.js
      - run: node server/web/tests/mail_setup.test.js

  # The Docker image is part of the product (plan 5 #36), so a change that breaks
  # it should fail here rather than at someone's `docker compose up`. The image
  # is built and then actually *run*: a build that produces a container which
  # can't serve /health has not been verified by building it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vellum-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it and probe /health
        run: |
          docker run -d --name vellum-ci -p 3000:3000 vellum-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok" || { docker logs vellum-ci; exit 1; }
          # The PDF fallback is the whole reason this image isn't `scratch`.
          docker exec vellum-ci pdftoppm -v
          docker exec vellum-ci vellum-server --version
      - name: Stop
        if: always()
        run: docker rm -f vellum-ci || true
