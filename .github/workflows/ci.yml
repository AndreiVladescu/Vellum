name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter_secure_storage needs libsecret on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: flutter pub get
      # Fail if the committed drift codegen is stale — the easiest CLAUDE.md
      # step to forget after editing database.dart.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- lib/data/database.g.dart
      - run: flutter analyze
      - run: flutter test
