# The JVM that runs Gradle itself: any JDK 21, found locally.
#
# This used to be the `updateDaemonJvm` output, pinning a JetBrains JDK and the
# foojay download link of one specific build. Those links are per build, and
# when foojay dropped that build (October 2026) every machine without it cached
# failed with "Could not HEAD ... 400 Bad Request" — CI first. No vendor and no
# URLs: CI installs Temurin 21 (ci.yml, release.yml), and Android Studio ships
# a JDK 21 of its own.
toolchainVersion=21
