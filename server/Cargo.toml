[package]
name = "vellum-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
lopdf = "0.43.0"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
# Pure-Rust image decode/encode for cached cover thumbnails (keeps the
# single-binary story — no shelling out). Only the codecs covers can be.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
# Pure-Rust zip reader, to pull an EPUB's declared cover image out of its
# archive (an EPUB is a zip) without shelling out. Read-only, deflate + stored.
zip = { version = "2", default-features = false, features = ["deflate"] }
# TLS for the sync server (opt-in via VELLUM_TLS). ring backend everywhere to
# avoid the aws-lc-rs C/cmake build and keep one crypto provider.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tar = "0.4"
lettre = { version = "0.11.22", default-features = false, features = [
    "tokio1-rustls",
    "smtp-transport",
    "builder",
    "ring",
    "hostname",
    "webpki-roots",
] }

# Used only to apply setrlimit resource caps to the PDF-render subprocesses on
# Unix (see blobs.rs). Unused on other platforms.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Building a real (tiny) PDF fixture for the content-index tests, rather than
# committing a binary blob nobody can read the provenance of.
lopdf = "0.43.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
