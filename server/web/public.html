<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vellum — shared book</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg:#eee9dd; --fg:#2e2822; --muted:#7d7263; --accent:#6e573f;
    --card:#f8f4e9; --line:#d5ccba; --gilt:#97825a;
    --laid:rgba(46,40,34,.025);
    --shadow:0 14px 40px rgba(46,38,28,.18);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141210; --fg:#dcd5c6; --muted:#8f8674; --accent:#94795a;
            --card:#1b1814; --line:#353026; --laid:rgba(220,213,198,.02);
            --shadow:0 14px 40px rgba(0,0,0,.55); }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:var(--sans); color:var(--fg);
    background:
      repeating-linear-gradient(0deg, transparent 0 26px, var(--laid) 26px 27px),
      var(--bg);
  }
  .card {
    position:relative; max-width:480px; margin:24px; padding:32px 30px 28px;
    border:1px solid var(--line); border-top:3px double var(--gilt);
    border-radius:12px;
    background:var(--card); box-shadow:var(--shadow); overflow:hidden;
  }
  .eyebrow {
    font-size:.62rem; text-transform:uppercase; letter-spacing:.22em;
    color:var(--muted); margin:6px 0 12px;
  }
  h1 { font-family:var(--serif); font-size:1.7rem; font-weight:600; line-height:1.15; margin:0 0 4px; }
  .subtitle { font-style:italic; color:var(--muted); margin:0 0 6px; }
  .authors { color:var(--muted); margin:0 0 18px; }
  .desc { line-height:1.6; white-space:pre-wrap; }
  .btn {
    display:inline-block; margin-top:22px; padding:12px 22px; border:0;
    border-radius:9px; background:var(--accent); color:#fff; font-size:1rem;
    text-decoration:none; cursor:pointer; transition:filter .12s;
  }
  .btn:hover { filter:brightness(1.08); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btn[disabled] { opacity:.5; pointer-events:none; }
  .note { margin-top:14px; font-size:.85rem; color:var(--muted); }
  .err { color:#b3261e; }
</style>
</head>
<body>
  <div class="card" id="card">
    <p id="status">Loading…</p>
  </div>
<script>
  const token = location.pathname.split('/').filter(Boolean).pop();
  const card = document.getElementById('card');

  function esc(s) {
    return (s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function load() {
    try {
      const res = await fetch('/api/public/' + encodeURIComponent(token));
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        card.innerHTML = '<p class="err">' +
          esc(body.error || 'This link is invalid or has expired.') + '</p>';
        return;
      }
      const b = await res.json();
      const authors = (b.authors || []).join(', ');
      const bits = [];
      if (b.published_year) bits.push(b.published_year);
      if (b.publisher) bits.push(esc(b.publisher));
      let html = '<img src="/assets/logo.svg" alt="" width="44" height="44" ' +
        'style="display:block;margin:0 0 10px">';
      html += '<p class="eyebrow">Shared from a Vellum library</p>';
      html += '<h1>' + esc(b.title) + '</h1>';
      if (b.subtitle) html += '<p class="subtitle">' + esc(b.subtitle) + '</p>';
      if (authors) html += '<p class="authors">' + esc(authors) + '</p>';
      if (b.description) html += '<p class="desc">' + esc(b.description) + '</p>';
      if (b.download_available) {
        // Reading comes first, and is offered even for a one-time link:
        // reading never consumes a use (plan 5 #33), so "read it here" is the
        // safe option and "download" is the one that spends the link.
        html += '<a class="btn" href="/r/' + encodeURIComponent(token) +
          '">Read it here</a> ';
        html += '<a class="btn" href="/api/public/' + encodeURIComponent(token) +
          '/file">Download</a>';
        if (b.one_time) html += '<p class="note">This is a one-time download — ' +
          'the link stops working afterwards.</p>';
      } else {
        html += '<p class="note">No downloadable file is attached to this book.</p>';
      }
      if (bits.length) html += '<p class="note">' + bits.join(' · ') + '</p>';
      card.innerHTML = html;
    } catch (e) {
      card.innerHTML = '<p class="err">Could not load this book.</p>';
    }
  }
  load();
</script>
</body>
</html>
