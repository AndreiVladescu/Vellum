<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room — Vellum</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg:#eee9dd; --fg:#2e2822; --muted:#7d7263; --accent:#6e573f;
    --card:#f8f4e9; --line:#d5ccba; --plank:#97825a;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141210; --fg:#dcd5c6; --muted:#8f8674; --accent:#94795a;
            --card:#1b1814; --line:#353026; --plank:#6d5c40; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans);
         display:flex; flex-direction:column; }

  header {
    display:flex; gap:12px; align-items:center; padding:10px 16px;
    background:var(--card); border-bottom:1px solid var(--line);
  }
  header h1 { font-family:var(--serif); font-size:1.1rem; margin:0; font-weight:600; }
  .spacer { flex:1; }
  .muted { color:var(--muted); }
  button {
    font:inherit; padding:6px 12px; border:1px solid var(--line);
    border-radius:8px; background:transparent; color:inherit; cursor:pointer;
  }
  button:hover { border-color:var(--accent); }

  #stage { flex:1; overflow:hidden; touch-action:none; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  svg { display:block; width:100%; height:100%; }
  .plank { stroke:var(--plank); stroke-width:0.012; stroke-linecap:round; }
  .spine { stroke:rgba(0,0,0,.28); stroke-width:0.002; }
  .spine.anon { opacity:.55; }
  .shelf-label { font-family:var(--sans); fill:var(--muted); }

  footer {
    padding:8px 16px; background:var(--card); border-top:1px solid var(--line);
    font-size:.85rem;
  }
  .err { padding:32px; text-align:center; }
</style>
</head>
<body>

<header>
  <h1 id="title">Loading…</h1>
  <span class="muted" id="count"></span>
  <span class="spacer"></span>
  <button id="fit">Fit</button>
  <button id="zin">+</button>
  <button id="zout">−</button>
</header>

<div id="stage"></div>

<footer class="muted" id="note"></footer>

<script src="/assets/room.js"></script>
</body>
</html>
