<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vellum console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/console.css">
</head>
<body>

<!-- Login -->
<div id="login">
  <img class="logo logo-lg" src="/assets/logo.svg" alt="" width="64" height="64">
  <h1>Vellum console</h1>
  <p class="muted">Sign in to manage the library.</p>
  <input id="l-email" type="text" placeholder="Email" autocomplete="username">
  <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary" style="width:100%" onclick="login()">Log in</button>
  <p class="err" id="l-err"></p>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div id="topbar">
    <header>
      <img class="logo" src="/assets/logo.svg" alt="" width="26" height="26">
      <h1>Vellum</h1>
      <span class="eyebrow">Console</span>
      <span class="muted" id="who"></span>
      <span class="spacer"></span>
      <span class="muted" id="count"></span>
      <button class="btn sm quiet" onclick="loadAll()">Refresh</button>
      <div class="menu-wrap">
        <button class="btn sm" onclick="toggleMenu(event,'m-manage')">Manage</button>
        <div class="menu hidden" id="m-manage">
          <button onclick="pick(showPeople)">People</button>
          <button onclick="pick(showStats)">Library server</button>
          <button onclick="pick(showActivity)">Activity</button>
          <button onclick="pick(showRooms)">Rooms</button>
          <button onclick="pick(showRequests)">Borrow requests</button>
          <hr>
          <button onclick="pick(showCert)">Certificate</button>
          <button onclick="pick(logout)">Log out</button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <button class="btn primary" onclick="openAddBook()">Add book</button>
      <input id="q" type="search" placeholder="Search title, author, ISBN…"
             oninput="setQ(this.value)" autocomplete="off">
      <!-- Content search (plan 5 #32). Hidden unless this server advertises
           `content_search`: a button that can only 400 is worse than none. -->
      <button class="btn sm hidden" id="contentbtn"
              onclick="searchContents()">Search inside books</button>
      <span class="spacer"></span>
      <div class="menu-wrap">
        <button class="btn sm" onclick="toggleMenu(event,'m-library')">Library</button>
        <div class="menu hidden" id="m-library">
          <div class="label">Add</div>
          <button onclick="pick(openImport)">Import books…</button>
          <button onclick="pick(createTag)">New tag…</button>
          <div class="label">Export</div>
          <button onclick="pick(exportCSV)">Export CSV</button>
          <button onclick="pick(exportJSON)">Export JSON</button>
          <div class="label">This table</div>
          <button onclick="pick(openColumns)">Choose columns…</button>
          <button onclick="pick(toggleDensity)">Compact rows</button>
          <button onclick="pick(saveView)">Save this view…</button>
        </div>
      </div>
    </div>

    <!-- Only rendered while rows are selected: these are the controls that
         used to sit on screen doing nothing most of the time. -->
    <div class="toolbar hidden" id="selbar"></div>

    <div class="toolbar">
      <span class="muted">Tags:</span>
      <span id="tagfilters"></span>
      <span id="missingfilters"></span>
      <span class="muted hidden" id="viewslabel">Views:</span>
      <span id="views"></span>
      <span class="spacer"></span>
      <button class="btn sm quiet" onclick="clearFilters()">Clear filters</button>
    </div>
  </div>

  <table id="tbl">
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="loadmore" class="hidden" style="text-align:center; padding:16px">
    <button class="btn" onclick="loadMoreBooks()"></button>
  </div>
</div>

<div id="modal-root"></div>

<script src="/assets/console.js"></script>
</body>
</html>
