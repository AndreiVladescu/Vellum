<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vellum console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/console.css">
</head>
<body>

<!-- Login -->
<div id="login" class="auth">
  <div class="auth-card">
    <img class="logo logo-xl" src="/assets/logo.svg" alt="" width="88" height="88">
    <h1>Vellum console</h1>
    <p class="auth-sub">Sign in to manage the library.</p>
    <form class="auth-form" onsubmit="event.preventDefault(); login()">
      <input id="l-email" type="text" placeholder="Email" aria-label="Email"
             autocomplete="username">
      <input id="l-pass" type="password" placeholder="Password" aria-label="Password"
             autocomplete="current-password">
      <button class="btn primary auth-go" type="submit">Log in</button>
    </form>
    <p class="err" id="l-err"></p>
    <!-- Shown only on a server that has no accounts yet; see checkRegistration(). -->
    <p class="auth-switch hidden" id="l-to-register">
      Nobody has an account here yet.
      <button class="btn sm quiet" onclick="showRegister()">Create the master account</button>
    </p>
  </div>
</div>

<!-- First run: the server has no master, so the only useful form is this one. -->
<div id="register" class="auth hidden">
  <div class="auth-card">
    <img class="logo logo-xl" src="/assets/logo.svg" alt="" width="88" height="88">
    <!-- An eyebrow that earns its place: this screen exists exactly once in a
         server's life, and saying so is the difference between "which form is
         this?" and "ah, I'm setting the library up". -->
    <p class="auth-eyebrow">First run</p>
    <h1>Create the master account</h1>
    <p class="auth-sub">It owns the library. You can add people later.</p>
    <form class="auth-form" onsubmit="event.preventDefault(); register()">
      <input id="r-email" type="text" placeholder="Email" aria-label="Email"
             autocomplete="username">
      <input id="r-name" type="text" placeholder="Display name" aria-label="Display name"
             autocomplete="name">
      <input id="r-pass" type="password" placeholder="Password, 8 characters or more"
             aria-label="Password" autocomplete="new-password">
      <!-- Only when the operator set VELLUM_BOOTSTRAP_TOKEN. -->
      <input id="r-token" class="hidden" type="password" placeholder="Bootstrap token"
             aria-label="Bootstrap token" autocomplete="off">
      <button class="btn primary auth-go" type="submit">Create account</button>
    </form>
    <p class="err" id="r-err"></p>
    <p class="auth-switch">
      <button class="btn sm quiet" onclick="showLogin()">Have an account? Log in</button>
    </p>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
 <div class="shell">
  <!-- Four groups, one address per page (router.js). On a narrow screen the
       groups fold behind the Menu button and the bar shows where you are. -->
  <nav id="nav" aria-label="Console">
    <div class="nav-head">
      <img class="logo" src="/assets/logo.svg" alt="" width="26" height="26">
      <span class="nav-brand">Vellum <span class="eyebrow">Console</span></span>
      <span class="nav-current" id="nav-current"></span>
      <button class="btn sm" id="nav-toggle" type="button" aria-expanded="false"
              aria-controls="nav-body" onclick="toggleNav()">Menu</button>
    </div>
    <div class="nav-body" id="nav-body">
      <div id="nav-groups"></div>
      <div class="nav-foot">
        <span class="muted" id="who"></span>
        <button class="btn sm quiet" type="button" onclick="refresh()">Refresh</button>
        <button class="btn sm quiet" type="button" onclick="logout()">Log out</button>
      </div>
    </div>
  </nav>

  <main id="main">
  <div id="topbar">
    <div class="toolbar">
      <button class="btn primary" onclick="openAddBook()">Add book</button>
      <input id="q" type="search" placeholder="Search title, author, ISBN…"
             aria-label="Search the library"
             oninput="setQ(this.value)" autocomplete="off">
      <!-- Content search (plan 5 #32). Hidden unless this server advertises
           `content_search`: a button that can only 400 is worse than none. -->
      <span class="sep hidden" id="contentsep"></span>
      <button class="btn sm hidden" id="contentbtn"
              onclick="searchContents()">Search inside books</button>
      <span class="spacer"></span>
      <span class="muted" id="count"></span>
      <div class="menu-wrap">
        <button class="btn sm" onclick="toggleMenu(event,'m-library')">Table</button>
        <div class="menu hidden" id="m-library">
          <div class="label">Export</div>
          <button onclick="pick(exportCSV)">Export CSV</button>
          <button onclick="pick(exportJSON)">Export JSON</button>
          <div class="label">This table</div>
          <button onclick="pick(openColumns)">Choose columns…</button>
          <button onclick="pick(toggleDensity)">Compact rows</button>
          <button onclick="pick(saveView)">Save this view…</button>
        </div>
      </div>
    </div>

    <!-- Only rendered while rows are selected: these are the controls that
         used to sit on screen doing nothing most of the time. -->
    <div class="toolbar hidden" id="selbar"></div>

    <div class="toolbar">
      <span class="muted">Tags:</span>
      <span id="tagfilters"></span>
      <span id="missingfilters"></span>
      <span class="muted hidden" id="viewslabel">Views:</span>
      <span id="views"></span>
      <span class="spacer"></span>
      <button class="btn sm quiet" onclick="clearFilters()">Clear filters</button>
    </div>
  </div>

  <!-- What focus lands on when the books are the page (router.js). -->
  <h1 id="books-heading" class="sr-only" tabindex="-1">Books</h1>
  <!-- On a narrow screen the table scrolls sideways in here, not the page. -->
  <div class="tablewrap">
    <table id="tbl">
      <thead id="thead"></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="loadmore" class="hidden" style="text-align:center; padding:16px">
    <button class="btn" onclick="loadMoreBooks()"></button>
  </div>

  <!-- Where Shares, People, Borrow requests and the rest are read. A page in
       the same place the table sits, rather than a box floating over it. -->
  <div id="page" class="hidden"></div>
  </main>
 </div>
</div>

<div id="modal-root"></div>

<script type="module" src="/assets/console/main.js"></script>
</body>
</html>
