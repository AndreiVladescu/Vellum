<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vellum console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/console.css">
</head>
<body>

<!-- Login -->
<div id="login">
  <img class="logo logo-lg" src="/assets/logo.svg" alt="" width="64" height="64">
  <h1>Vellum console</h1>
  <p class="muted">Sign in to manage the library.</p>
  <input id="l-email" type="text" placeholder="Email" autocomplete="username">
  <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary" style="width:100%" onclick="login()">Log in</button>
  <p class="err" id="l-err"></p>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div id="topbar">
    <header>
      <img class="logo" src="/assets/logo.svg" alt="" width="30" height="30">
      <h1>Vellum</h1>
      <span class="eyebrow">Console</span>
      <span class="muted" id="who"></span>
      <span class="spacer"></span>
      <span class="muted" id="count"></span>
      <button class="btn" onclick="loadAll()">Refresh</button>
      <button class="btn" onclick="showCert()">Certificate</button>
      <button class="btn" onclick="showStats()">Server</button>
      <button class="btn" onclick="showActivity()">Activity</button>
      <button class="btn" onclick="showRooms()">Rooms</button>
      <button class="btn" onclick="showRequests()">Requests</button>
      <button class="btn" onclick="showPeople()">People</button>
      <button class="btn" onclick="logout()">Log out</button>
    </header>

    <div class="toolbar">
      <button class="btn primary" onclick="openAddBook()">＋ Add book</button>
      <button class="btn" onclick="openImport()">Import CSV</button>
      <span class="sep"></span>
      <div class="group">
        <input id="newtag" type="text" placeholder="New tag name" style="width:140px">
        <button class="btn" onclick="createTag()">Create tag</button>
      </div>
      <span class="sep"></span>
      <div class="group">
        <select id="bulktag"></select>
        <button class="btn" onclick="bulkTag(true)">Tag</button>
        <button class="btn" onclick="bulkTag(false)">Untag</button>
      </div>
      <button class="btn" onclick="openBulkEdit()">Edit selected</button>
      <button class="btn" onclick="enrichSelected()">Fetch metadata</button>
      <button class="btn" onclick="uploadToSelected()">Upload to selected</button>
      <button class="btn danger" onclick="deleteSelected()">Delete selected</button>
      <span class="spacer"></span>
      <button class="btn sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn sm" onclick="exportJSON()">Export JSON</button>
      <button class="btn sm" onclick="openColumns()">Columns ▾</button>
      <button class="btn sm" onclick="toggleDensity()">Density</button>
    </div>

    <div class="toolbar">
      <input id="q" type="text" placeholder="Search title, author, ISBN…"
             oninput="setQ(this.value)" style="width:240px" autocomplete="off">
      <span class="muted">Tags:</span>
      <span id="tagfilters"></span>
      <span class="sep"></span>
      <span id="missingfilters"></span>
      <button class="btn sm" onclick="clearFilters()">Clear filters</button>
      <span class="sep"></span>
      <!-- Saved views (plan 5 #35): a name for how you like to look at the
           library, kept in this browser like the density toggle. -->
      <span class="muted">Views:</span>
      <span id="views"></span>
      <button class="btn sm" onclick="saveView()">Save this view</button>
      <!-- Content search (plan 5 #32). Hidden unless this server advertises
           `content_search`: a button that can only 400 is worse than none. -->
      <span class="sep hidden" id="contentsep"></span>
      <button class="btn sm hidden" id="contentbtn"
              onclick="searchContents()">Search inside books</button>
    </div>
  </div>

  <table id="tbl">
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="loadmore" class="hidden" style="text-align:center; padding:16px">
    <button class="btn" onclick="loadMoreBooks()"></button>
  </div>
</div>

<div id="modal-root"></div>

<script src="/assets/console.js"></script>
</body>
</html>
