<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vellum console</title>
<style>
  :root { color-scheme: light dark; --line:#e3dccd; --bg:#faf6ee; --fg:#2a241c;
          --muted:#8a7c68; --accent:#7a5c3e; --chip:#efe7d6; --row:#fff; --alt:#f6f1e7; }
  @media (prefers-color-scheme: dark) {
    :root { --line:#3a3228; --bg:#171310; --fg:#e8e0d4; --muted:#9c8f79;
            --accent:#a07c54; --chip:#2f2820; --row:#1e1913; --alt:#191510; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px;
           border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:1.15rem; margin:0; flex:0 0 auto; }
  header .spacer { flex:1; }
  .muted { color:var(--muted); }
  button, select, input { font:inherit; }
  .btn { border:1px solid var(--line); background:var(--row); color:var(--fg);
         padding:7px 12px; border-radius:7px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.danger { color:#b3261e; }
  .btn[disabled] { opacity:.45; cursor:default; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
             padding:12px 18px; border-bottom:1px solid var(--line); position:sticky;
             top:49px; background:var(--bg); z-index:4; }
  .toolbar .group { display:flex; gap:6px; align-items:center; }
  input[type=text], input[type=date], select {
    padding:7px 9px; border:1px solid var(--line); border-radius:7px;
    background:var(--row); color:var(--fg); }
  table { border-collapse:collapse; width:100%; }
  th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  thead th { position:sticky; top:99px; background:var(--alt); z-index:3; font-size:.85rem; }
  tbody tr:nth-child(even) { background:var(--alt); }
  tbody tr:nth-child(odd) { background:var(--row); }
  tbody tr.sel { outline:2px solid var(--accent); outline-offset:-2px; }
  tbody tr.drop { outline:2px dashed var(--accent); outline-offset:-2px; background:var(--chip); }
  td.year, td.actions { white-space:nowrap; }
  .chip { display:inline-flex; align-items:center; gap:5px; background:var(--chip);
          border-radius:999px; padding:3px 9px; margin:2px 3px 2px 0; font-size:.85rem; }
  .chip button { border:0; background:none; color:var(--muted); cursor:pointer; padding:0; font-size:.95rem; line-height:1; }
  .addtag { border:1px dashed var(--line); background:none; color:var(--muted);
            border-radius:999px; padding:3px 9px; cursor:pointer; font-size:.85rem; }
  #login { max-width:340px; margin:12vh auto; padding:26px; border:1px solid var(--line);
           border-radius:12px; background:var(--row); }
  #login h1 { margin-top:0; }
  #login input { width:100%; margin:6px 0 12px; }
  .err { color:#b3261e; min-height:1.2em; }
  .hidden { display:none !important; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center; z-index:20; }
  .modal { background:var(--row); border-radius:12px; padding:22px; width:min(420px,92vw); }
  .modal h2 { margin-top:0; }
  .modal label { display:block; margin:12px 0 4px; }
  .modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .linkout { word-break:break-all; background:var(--alt); padding:10px; border-radius:8px; font-family:monospace; }
  .modal input[type=text], .modal textarea { width:100%; }
  .modal label { display:block; margin:10px 0 3px; font-size:.82rem; color:var(--muted); }
  .modal textarea { background:var(--row); color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:8px; font:inherit; resize:vertical; min-height:80px; }
  .cover-box { width:120px; height:180px; border-radius:6px; background:var(--chip); flex:0 0 auto; cursor:pointer; overflow:hidden; position:relative; }
  .cover-box img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cover-box .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.78rem; color:var(--muted); }
  /* The change affordance only appears on hover, over the shown cover. */
  .cover-box .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; font-size:.8rem; color:#fff; background:rgba(0,0,0,.5); opacity:0; transition:opacity .15s; }
  .cover-box:hover .overlay { opacity:1; }
  .uprog { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:40; display:none; align-items:center; gap:10px; background:var(--row); border:1px solid var(--line); border-radius:10px; padding:10px 14px; box-shadow:0 6px 24px rgba(0,0,0,.3); min-width:300px; }
  .uprog-label { font-size:.85rem; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .uprog-track { flex:1; height:6px; background:var(--chip); border-radius:3px; overflow:hidden; }
  .uprog-bar { height:100%; width:0; background:var(--accent); transition:width .1s linear; }
  .uprog-pct { font-size:.8rem; color:var(--muted); min-width:36px; text-align:right; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:7px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .link { color:var(--accent); cursor:pointer; }
  .link:hover { text-decoration:underline; }
  .ab-item { display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; }
  .ab-item:hover { border-color:var(--accent); }
  .ab-item img { width:34px; height:48px; object-fit:cover; border-radius:3px; flex:0 0 auto; }
  .ab-noimg { width:34px; height:48px; background:var(--chip); border-radius:3px; flex:0 0 auto; }
  .ab-drop { margin-top:10px; padding:16px; border:1px dashed var(--line); border-radius:8px; text-align:center; color:var(--muted); cursor:pointer; }
  .ab-drop.over { border-color:var(--accent); background:var(--chip); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
           background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:8px; z-index:30; }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <h1>Vellum console</h1>
  <p class="muted">Sign in to manage the library.</p>
  <input id="l-email" type="text" placeholder="Email" autocomplete="username">
  <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary" style="width:100%" onclick="login()">Log in</button>
  <p class="err" id="l-err"></p>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <h1>Vellum</h1>
    <span class="muted" id="who"></span>
    <span class="spacer"></span>
    <button class="btn" onclick="loadAll()">Refresh</button>
    <button class="btn" onclick="logout()">Log out</button>
  </header>

  <div class="toolbar">
    <button class="btn primary" onclick="openAddBook()">＋ Add book</button>
    <span class="muted">|</span>
    <div class="group">
      <input id="newtag" type="text" placeholder="New tag name" style="width:150px">
      <button class="btn" onclick="createTag()">Create tag</button>
    </div>
    <span class="muted">|</span>
    <div class="group">
      <select id="bulktag"></select>
      <button class="btn" onclick="bulkTag(true)">Tag selected</button>
      <button class="btn" onclick="bulkTag(false)">Untag selected</button>
    </div>
    <span class="muted">|</span>
    <button class="btn danger" onclick="deleteSelected()">Delete selected</button>
    <span class="spacer"></span>
    <span class="muted" id="count"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:34px"><input type="checkbox" id="selall" onchange="toggleAll(this.checked)"></th>
        <th>Title</th>
        <th style="width:70px">Year</th>
        <th>Tags</th>
        <th style="width:120px">Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="modal-root"></div>

<script>
const S = { token: localStorage.getItem('vellum_token'), email: localStorage.getItem('vellum_email'),
            books: [], groups: [], members: new Set(), selected: new Set() };
const AB = { results: [], file: null };

function esc(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function key(g,b){ return g+'|'+b; }

async function api(method, path, body){
  const res = await fetch(path, {
    method,
    headers: { 'content-type':'application/json', ...(S.token?{authorization:'Bearer '+S.token}:{}) },
    body: body!==undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  const data = res.status===204 ? null : await res.json().catch(()=>null);
  if (!res.ok) throw new Error((data&&data.error) || ('HTTP '+res.status));
  return data;
}

async function login(){
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  const err = document.getElementById('l-err');
  err.textContent = '';
  try {
    const r = await api('POST','/api/auth/login',{ email, password: pass });
    S.token = r.token; S.email = r.user.email;
    localStorage.setItem('vellum_token', S.token);
    localStorage.setItem('vellum_email', S.email);
    showApp();
  } catch(e){ err.textContent = e.message; }
}

function logout(){
  S.token=null; localStorage.removeItem('vellum_token'); localStorage.removeItem('vellum_email');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent = S.email || '';
  loadAll();
}

async function loadAll(){
  try {
    const [books, groups, members] = await Promise.all([
      api('GET','/api/books'), api('GET','/api/groups'), api('GET','/api/memberships'),
    ]);
    S.books = books; S.groups = groups;
    S.members = new Set(members.map(m=>key(m.group_id,m.book_id)));
    S.selected = new Set([...S.selected].filter(id=>books.some(b=>b.id===id)));
    render();
  } catch(e){ toast(e.message); }
}

function render(){
  // bulk tag dropdown
  const sel = document.getElementById('bulktag');
  sel.innerHTML = S.groups.length
    ? S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')
    : '<option value="">(no tags yet)</option>';

  const rows = document.getElementById('rows');
  rows.innerHTML = S.books.map(b=>{
    const tags = S.groups.filter(g=>S.members.has(key(g.id,b.id)));
    const chips = tags.map(g=>
      `<span class="chip">${esc(g.name)}<button title="Remove tag" onclick="removeTag('${g.id}','${b.id}')">×</button></span>`
    ).join('');
    const checked = S.selected.has(b.id) ? 'checked' : '';
    return `<tr class="${S.selected.has(b.id)?'sel':''}"
        ondragover="dragOver(event,this)" ondragleave="dragLeave(this)" ondrop="dropOn(event,'${b.id}',this)"
        title="Drop a PDF/EPUB or cover image here">
      <td><input type="checkbox" ${checked} onchange="toggleRow('${b.id}',this.checked)"></td>
      <td><span class="link" onclick="openDetail('${b.id}')">${esc(b.title)}</span></td>
      <td class="year">${b.published_year??''}</td>
      <td>${chips}<button class="addtag" onclick="quickAdd(this,'${b.id}')">＋ tag</button></td>
      <td class="actions">
        <button class="btn" onclick="pickUpload('${b.id}')">Upload</button>
        <button class="btn" onclick="openLink('${b.id}')">Link</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('count').textContent =
    `${S.books.length} books · ${S.selected.size} selected`;
  document.getElementById('selall').checked =
    S.books.length>0 && S.selected.size===S.books.length;
}

function toggleRow(id, on){ on?S.selected.add(id):S.selected.delete(id); render(); }
function toggleAll(on){ S.selected = on ? new Set(S.books.map(b=>b.id)) : new Set(); render(); }

function openAddBook(){
  AB.results = []; AB.file = null;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
   <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="width:min(600px,94vw)">
      <h2>Add a book</h2>
      <input id="ab-q" type="text" autocomplete="off" placeholder="Title, author, or ISBN">
      <div class="row" style="justify-content:flex-start; margin-top:10px">
        <button class="btn" id="ab-search" onclick="runSearch(document.getElementById('ab-q').value.trim())">Search</button>
        <button class="btn primary" id="ab-create" onclick="createBook()">Create book</button>
      </div>
      <div id="ab-drop" class="ab-drop" onclick="pickAbFile()"
        ondragover="abDragOver(event)" ondragleave="abDragLeave()" ondrop="abDrop(event)">
        Drop a PDF/EPUB here, or click to choose (optional)
      </div>
      <div id="ab-status" class="muted" style="margin:10px 0"></div>
      <div id="ab-results" style="max-height:40vh; overflow:auto"></div>
      <div class="row"><button class="btn" onclick="closeModal()">Close</button></div>
    </div>
   </div>`;
  const q = document.getElementById('ab-q');
  q.focus();
  q.addEventListener('keydown', ev=>{ if (ev.key==='Enter'){ ev.preventDefault(); runSearch(q.value.trim()); } });
}

function pickAbFile(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.pdf,.epub';
  input.onchange = ()=>{ if (input.files[0]) setAbFile(input.files[0]); };
  input.click();
}
async function setAbFile(file){
  const kind = await classify(file);
  if (kind !== 'pdf' && kind !== 'epub'){ toast('Only PDF or EPUB can be attached'); return; }
  AB.file = file;
  const d = document.getElementById('ab-drop');
  if (d) d.textContent = 'Attached: ' + file.name;
  // Seed the title from the filename when the user hasn't typed one.
  const q = document.getElementById('ab-q');
  if (q && !q.value.trim()) q.value = file.name.replace(/\.[^.]+$/, '');
}
function abDragOver(e){ e.preventDefault(); document.getElementById('ab-drop').classList.add('over'); }
function abDragLeave(){ const d = document.getElementById('ab-drop'); if (d) d.classList.remove('over'); }
function abDrop(e){ e.preventDefault(); abDragLeave(); const f = e.dataTransfer.files[0]; if (f) setAbFile(f); }

async function runSearch(query){
  const status = document.getElementById('ab-status');
  const box = document.getElementById('ab-results');
  if (!query){ status.textContent = 'Type a title, author, or ISBN to search.'; return; }
  status.textContent = 'Searching…'; box.innerHTML = '';
  try {
    const list = await api('GET','/api/metadata/search?q='+encodeURIComponent(query));
    AB.results = list;
    if (!list.length){
      status.innerHTML = 'No matches — use <b>Create book</b> above to add “'+esc(query)+'” yourself.';
      return;
    }
    status.textContent = list.length+' result'+(list.length>1?'s':'')+' — click one to add';
    box.innerHTML = list.map((r,i)=>{
      const cover = r.cover_id ? 'https://covers.openlibrary.org/b/id/'+r.cover_id+'-S.jpg' : (r.cover_url||'');
      const meta = [ (r.authors||[]).join(', '), r.first_publish_year||'' ].filter(Boolean).join(' · ');
      return '<div class="ab-item" onclick="addResult('+i+')">'+
        (cover ? '<img src="'+esc(cover)+'" alt="" onerror="this.remove()">' : '<div class="ab-noimg"></div>')+
        '<div><div>'+esc(r.title)+'</div><div class="muted">'+esc(meta)+'</div></div></div>';
    }).join('');
  } catch(e){ status.textContent = e.message; }
}

async function addResult(i){
  const r = AB.results[i];
  const status = document.getElementById('ab-status');
  status.textContent = 'Adding “'+r.title+'”…';
  try {
    const book = await api('POST','/api/books/from-search', r);
    if (AB.file) await uploadTo(book.id, AB.file);
    closeModal(); await loadAll(); toast('Added “'+r.title+'”');
  } catch(e){ status.textContent = e.message; }
}

async function createBook(){
  const title = document.getElementById('ab-q').value.trim();
  const status = document.getElementById('ab-status');
  if (!title){ status.textContent = 'Enter a title first.'; return; }
  const createBtn = document.getElementById('ab-create');
  const searchBtn = document.getElementById('ab-search');
  createBtn.disabled = true; searchBtn.disabled = true;
  createBtn.innerHTML = '<span class="spin"></span>Creating…';
  status.textContent = '';
  try {
    const book = await api('POST','/api/books',{ title });
    if (AB.file){
      createBtn.innerHTML = '<span class="spin"></span>Uploading…';
      await uploadTo(book.id, AB.file); // shows the progress bar
    }
    closeModal(); await loadAll(); toast('Created “'+title+'”');
  } catch(e){
    status.textContent = e.message;
    createBtn.disabled = false; searchBtn.disabled = false;
    createBtn.innerHTML = 'Create book';
  }
}

// Classify a dropped/picked file by its magic bytes (not just its name).
async function classify(file){
  const buf = new Uint8Array(await file.slice(0,16).arrayBuffer());
  const m = sig => sig.every((byte,i)=>buf[i]===byte);
  if (m([0x25,0x50,0x44,0x46])) return 'pdf';                       // %PDF
  if (m([0xFF,0xD8,0xFF]) || m([0x89,0x50,0x4E,0x47]) || m([0x47,0x49,0x46,0x38])) return 'image';
  if (m([0x50,0x4B,0x03,0x04]) && file.name.toLowerCase().endsWith('.epub')) return 'epub';
  return 'unsupported';
}

// A global upload progress bar (fetch can't report upload progress, so uploads
// use XMLHttpRequest).
function showProgress(label){
  let el = document.getElementById('uprog');
  if (!el){
    el = document.createElement('div');
    el.id = 'uprog'; el.className = 'uprog';
    el.innerHTML = '<div class="uprog-label"></div><div class="uprog-track"><div class="uprog-bar"></div></div><div class="uprog-pct"></div>';
    document.body.appendChild(el);
  }
  el.querySelector('.uprog-label').textContent = label;
  el.querySelector('.uprog-bar').style.width = '0%';
  el.querySelector('.uprog-pct').textContent = '0%';
  el.style.display = 'flex';
}
function setProgress(fraction){
  const el = document.getElementById('uprog'); if (!el) return;
  const pct = Math.round(fraction * 100);
  el.querySelector('.uprog-bar').style.width = pct + '%';
  el.querySelector('.uprog-pct').textContent = (pct >= 100 ? 'finishing…' : pct + '%');
}
function hideProgress(){ const el = document.getElementById('uprog'); if (el) el.style.display = 'none'; }

function xhrUpload(method, url, file, mime){
  return new Promise((resolve, reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open(method, url);
    xhr.setRequestHeader('authorization', 'Bearer ' + S.token);
    xhr.setRequestHeader('content-type', mime);
    xhr.upload.onprogress = e => { if (e.lengthComputable) setProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();
      let msg = 'Upload failed (HTTP ' + xhr.status + ')';
      try { const j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch(_) {}
      reject(new Error(msg));
    };
    xhr.onerror = () => reject(new Error('Network error during upload'));
    xhr.send(file);
  });
}

async function uploadTo(id, file){
  const kind = await classify(file);
  if (kind !== 'image' && kind !== 'pdf' && kind !== 'epub'){
    toast('Only PDF, EPUB, or image files are accepted');
    return false;
  }
  showProgress('Uploading ' + file.name);
  try {
    if (kind === 'image'){
      await xhrUpload('PUT', '/api/books/'+id+'/cover', file, file.type || 'image/jpeg');
      toast('Cover updated'); await loadAll();
    } else {
      const mime = kind === 'epub' ? 'application/epub+zip' : 'application/pdf';
      await xhrUpload('POST', '/api/books/'+id+'/files?filename='+encodeURIComponent(file.name), file, mime);
      toast('Uploaded ' + file.name);
    }
    return true;
  } catch(e){ toast(e.message); return false; }
  finally { hideProgress(); }
}

function pickUpload(id){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.pdf,.epub,image/*';
  input.onchange = ()=>{ if (input.files[0]) uploadTo(id, input.files[0]); };
  input.click();
}

function dragOver(e, tr){ e.preventDefault(); tr.classList.add('drop'); }
function dragLeave(tr){ tr.classList.remove('drop'); }
function dropOn(e, id, tr){
  e.preventDefault(); tr.classList.remove('drop');
  const f = e.dataTransfer.files[0];
  if (f) uploadTo(id, f);
}

async function createTag(){
  const input = document.getElementById('newtag');
  const name = input.value.trim();
  if (!name) return;
  try { await api('POST','/api/groups',{ name }); input.value=''; await loadAll(); toast('Tag created'); }
  catch(e){ toast(e.message); }
}

async function addMember(groupId, bookId){
  if (S.members.has(key(groupId,bookId))) return;
  await api('POST', `/api/groups/${groupId}/books`, { book_id: bookId });
}
async function removeTag(groupId, bookId){
  try { await api('DELETE', `/api/groups/${groupId}/books/${bookId}`); await loadAll(); }
  catch(e){ toast(e.message); }
}

async function bulkTag(add){
  const groupId = document.getElementById('bulktag').value;
  if (!groupId || S.selected.size===0) { toast('Pick a tag and select some books'); return; }
  try {
    for (const bookId of S.selected){
      if (add) await addMember(groupId, bookId);
      else if (S.members.has(key(groupId,bookId)))
        await api('DELETE', `/api/groups/${groupId}/books/${bookId}`);
    }
    await loadAll(); toast(add?'Tagged':'Untagged');
  } catch(e){ toast(e.message); }
}

function quickAdd(btn, bookId){
  const avail = S.groups.filter(g=>!S.members.has(key(g.id,bookId)));
  if (avail.length===0){ toast('No more tags — create one first'); return; }
  const sel = document.createElement('select');
  sel.innerHTML = '<option value="">Add tag…</option>' +
    avail.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
  sel.onchange = async ()=>{
    if (!sel.value) return;
    try { await addMember(sel.value, bookId); await loadAll(); }
    catch(e){ toast(e.message); }
  };
  btn.replaceWith(sel); sel.focus();
}

async function deleteSelected(){
  if (S.selected.size===0) return;
  if (!confirm(`Delete ${S.selected.size} book(s)? This cannot be undone.`)) return;
  try { for (const id of S.selected) await api('DELETE', `/api/books/${id}`);
        S.selected.clear(); await loadAll(); toast('Deleted'); }
  catch(e){ toast(e.message); }
}

function fmtSize(b){ return b>=1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }

async function openDetail(id){
  let d;
  try { d = await api('GET','/api/books/'+id+'/detail'); }
  catch(e){ toast(e.message); return; }
  const tok = encodeURIComponent(S.token);
  const authors = (d.authors||[]).join(', ');
  const genres = (d.genres||[]);
  const list = (d.files||[]).map(f =>
    '<div class="ab-item"><div style="flex:1">'+esc(f.format.toUpperCase())+' · '+fmtSize(f.size_bytes)+'</div>'+
    '<a class="btn" href="/api/files/'+f.id+'?token='+tok+'" download="'+esc(d.title)+'.'+esc(f.format)+'">Download</a></div>'
  ).join('');
  const upBtn = '<button class="btn" onclick="detailPick(\''+id+'\',\'.pdf,.epub\')">Upload</button>';
  const files = list
    ? list + '<div style="text-align:right; margin-top:6px">'+upBtn+'</div>'
    : '<div style="display:flex; align-items:center; gap:10px"><span class="muted">No files uploaded.</span>'+upBtn+'</div>';
  const root = document.getElementById('modal-root');
  root.innerHTML = `
   <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="width:min(720px,95vw); max-height:90vh; overflow:auto">
      <div style="display:flex; gap:16px">
        <div class="cover-box" onclick="detailPick('${id}','image/*')">
          <span class="hint">No cover</span>
          <img src="/api/books/${id}/cover?token=${tok}&t=${Date.now()}" alt="" onerror="this.remove()">
          <div class="overlay">Change cover</div>
        </div>
        <div style="flex:1; min-width:0">
          <label>Title</label><input id="d-title" type="text" value="${esc(d.title)}">
          <label>Subtitle</label><input id="d-subtitle" type="text" value="${esc(d.subtitle||'')}">
          <label>Year</label><input id="d-year" type="text" value="${d.published_year??''}">
          <div class="muted" style="margin-top:8px">${
            [authors?('by '+esc(authors)):'', d.publisher?esc(d.publisher):'', d.isbn?('ISBN '+esc(d.isbn)):''].filter(Boolean).join(' · ')
          }</div>
          ${genres.length?('<div style="margin-top:6px">'+genres.map(g=>'<span class="chip">'+esc(g)+'</span>').join('')+'</div>'):''}
        </div>
      </div>
      <label>Description</label>
      <textarea id="d-desc" rows="5">${esc(d.description||'')}</textarea>
      <label>Files</label>
      ${files}
      <div class="row" style="justify-content:space-between; margin-top:16px">
        <button class="btn danger" onclick="deleteBook('${id}')">Delete</button>
        <div>
          <button class="btn" onclick="closeModal()">Close</button>
          <button class="btn primary" onclick="saveDetail('${id}')">Save</button>
        </div>
      </div>
    </div>
   </div>`;
}

// Pick a file (image for a cover, or PDF/EPUB for a book file) and upload it,
// routed by magic bytes, then refresh the detail view.
function detailPick(id, accept){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = accept;
  input.onchange = async ()=>{
    if (!input.files[0]) return;
    await uploadTo(id, input.files[0]);
    openDetail(id);
  };
  input.click();
}

async function saveDetail(id){
  const body = {
    title: document.getElementById('d-title').value.trim(),
    subtitle: document.getElementById('d-subtitle').value,
    description: document.getElementById('d-desc').value,
  };
  const y = document.getElementById('d-year').value.trim();
  if (y && !isNaN(parseInt(y,10))) body.published_year = parseInt(y,10);
  if (!body.title){ toast('Title cannot be empty'); return; }
  try { await api('PATCH','/api/books/'+id, body); closeModal(); await loadAll(); toast('Saved'); }
  catch(e){ toast(e.message); }
}

async function deleteBook(id){
  if (!confirm('Delete this book? This cannot be undone.')) return;
  try { await api('DELETE','/api/books/'+id); closeModal(); await loadAll(); toast('Deleted'); }
  catch(e){ toast(e.message); }
}

function openLink(bookId){
  const book = S.books.find(b=>b.id===bookId);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
   <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>Public link</h2>
      <p class="muted">${esc(book?book.title:'')}</p>
      <label><input type="checkbox" id="m-onetime"> One-time download</label>
      <label>Expires on (optional)</label>
      <input type="date" id="m-exp">
      <div id="m-out"></div>
      <div class="row">
        <button class="btn" onclick="closeModal()">Close</button>
        <button class="btn primary" id="m-create" onclick="createLink('${bookId}')">Create link</button>
      </div>
    </div>
   </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

async function createLink(bookId){
  const oneTime = document.getElementById('m-onetime').checked;
  const exp = document.getElementById('m-exp').value; // YYYY-MM-DD or ''
  try {
    const r = await api('POST','/api/share-links', {
      book_id: bookId, one_time: oneTime, ...(exp?{expires_at:exp}:{}),
    });
    const out = document.getElementById('m-out');
    out.innerHTML = `<label>Share this link</label>
      <div class="linkout" id="m-url">${esc(r.url)}</div>
      <div class="row"><button class="btn" onclick="copyUrl('${esc(r.url)}')">Copy</button></div>`;
    document.getElementById('m-create').disabled = true;
  } catch(e){ toast(e.message); }
}
function copyUrl(url){ navigator.clipboard.writeText(url).then(()=>toast('Copied')); }

// boot
if (S.token) showApp();
</script>
</body>
</html>
